; =================================================================
; CraftThingy Digital Innovation - Washing Machine Controller
; Targets: ESP32 Variants (ESP32 Standard, ESP32-S3, ESP32-C3)
; =================================================================

[platformio]
default_envs = esp32dev, esp32s3, esp32c3
src_dir = src
include_dir = include

[common]
framework = arduino
monitor_speed = 115200
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D CRAFT_CONTROLLER_ROLE=\"washing_machine\"
    -D APP_VERSION=\"1.0.0\"

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.partitions = min_spiffs.csv
build_flags =
    ${common.build_flags}
    -D BOARD_TYPE=\"esp32\"
    -D ASSET_TAG=\"esp32\"
    -Os

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.partitions = default_8MB.csv
build_flags =
    ${common.build_flags}
    -D BOARD_TYPE=\"esp32s3\"
    -D ASSET_TAG=\"esp32s3\"
    -Os

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.partitions = min_spiffs.csv
build_flags =
    ${common.build_flags}
    -D BOARD_TYPE=\"esp32c3\"
    -D ASSET_TAG=\"esp32c3\"
    -Os
