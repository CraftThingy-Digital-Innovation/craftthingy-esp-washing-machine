name: Build and Release Washing Machine Firmware

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build Washing Machine Firmware & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build All Board Targets
        run: |
          pio run -e esp32dev
          pio run -e esp32s3
          pio run -e esp32c3

      - name: Package Firmware Binaries & Calculate Hashes
        run: |
          mkdir -p release_assets
          cp .pio/build/esp32dev/firmware.bin release_assets/firmware-washing_machine-esp32.bin
          cp .pio/build/esp32s3/firmware.bin release_assets/firmware-washing_machine-esp32s3.bin
          cp .pio/build/esp32c3/firmware.bin release_assets/firmware-washing_machine-esp32c3.bin
          
          cd release_assets
          for f in *.bin; do
            sha256sum "$f" > "${f}.sha256"
          done

      - name: Determine Target Tag & Generate Rich Release Notes
        id: release_meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

          cat << EOF > release_notes.md
          ## 🧺 CraftThingy Washing Machine Controller - ${TAG}

          Official production release of the automated Washing Machine Appliance Controller module for the **CraftThingy Digital Innovation** ecosystem.

          ### 📦 Pre-Compiled Firmware Binaries
          Download the appropriate binary matching your hardware target:

          | Target Board | Architecture | Asset Name | Checksum |
          |---|---|---|---|
          | **ESP32 Standard** | Dual-Core Xtensa | \`firmware-washing_machine-esp32.bin\` | \`.sha256\` |
          | **ESP32-S3** | Dual-Core Xtensa | \`firmware-washing_machine-esp32s3.bin\` | \`.sha256\` |
          | **ESP32-C3** | Single-Core RISC-V | \`firmware-washing_machine-esp32c3.bin\` | \`.sha256\` |

          ---

          ### 🛡️ Features Included in this Release
          - **Multi-Stage Automated Wash Cycle**: Fill $\rightarrow$ Wash $\rightarrow$ Rinse $\rightarrow$ Drain $\rightarrow$ Spin $\rightarrow$ Complete.
          - **Relay Sequencing**: Manages water inlet valves, wash agitator motor, and drain pump with hardware safety interlocks.
          - **OTA Safety Guard**: Rejects or postpones firmware updates while an active cycle is in progress.
          - **REST API Telemetry**: Reports cycle state, elapsed time, and operational diagnostics.

          ---

          ### ⚡ Installation
          To switch a connected ESP running \`craftthingy-esp-core-ota\` to this module via API:
          \`\`\`bash
          python tools/craftthingy_esp_ctl.py set-github --host 192.168.4.1 \\
            --org "CraftThingy-Digital-Innovation" \\
            --ctrl "craftthingy-esp-washing-machine" \\
            --role "washing_machine" \\
            --key "<CURRENT_KEY>"
          \`\`\`
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "CraftThingy Washing Machine Controller ${{ steps.release_meta.outputs.tag }}"
          tag_name: ${{ steps.release_meta.outputs.tag }}
          body_path: release_notes.md
          files: release_assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
